name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.401
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore Tests/Nexora.Tests.csproj

      - name: Build
        run: dotnet build Tests/Nexora.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/Nexora.Tests.csproj --configuration Release --no-build --verbosity normal
